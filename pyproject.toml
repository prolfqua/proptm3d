[project]
name = "proptm3d"
version = "0.1.0"
description = "Prepare method-scoped PTM statistics, GSEA, annotations, and AlphaFold structures for a browser app."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["THIRD_PARTY_NOTICES.md"]
authors = [
    { name = "Functional Genomics Center Zurich" },
]

dependencies = [
    "biopython>=1.85,<2",
    "cbor2>=5.6,<6",
    "cyclopts",
    "h5py>=3.12",
    "ijson>=3.4,<4",
    "loguru",
    "numpy",
    "polars",
    "platformdirs>=4,<5",
    "requests",
]

[project.scripts]
proptm3d = "proptm3d.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "deptry>=0.23",
    "import-linter>=2,<3",
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.14",
    "twine>=6",
]
docs = [
    "myst-parser>=4,<5",
    "sphinx>=8.2,<10",
    "sphinx-book-theme>=1.1,<2",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "F",   # pyflakes
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "RUF", # ruff-specific
    "C90", # mccabe complexity
    "SIM", # flake8-simplify
    "RET", # flake8-return
    "PTH", # flake8-use-pathlib
    "PT",  # flake8-pytest-style
    "TID", # flake8-tidy-imports
    "ARG", # flake8-unused-arguments
    "EM",  # flake8-errmsg
    "D",   # pydocstyle
    "ANN", # flake8-annotations
]
ignore = ["ANN401"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "ANN", "ARG", "EM"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
branch = true
relative_files = true
source = ["proptm3d"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.deptry]
known_first_party = ["proptm3d"]

[tool.importlinter]
root_package = "proptm3d"

[[tool.importlinter.contracts]]
name = "CLI composes preparation, bundling, and static serving"
type = "layers"
exhaustive = true
containers = ["proptm3d"]
layers = [
    "cli",
    "bundle | prepare | prepared_history | webapp",
    "browser_assets | plot_backgrounds | prepared_root | structural_context_cache",
    "alphafold_cache | gsea_data | prepared_data | structural_context",
    "uniprot_cache | uniprot_accession",
]
