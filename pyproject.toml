[project]
name = "proptm3d"
version = "0.1.0"
description = "Map differential PTM results onto AlphaFold 3D structures with interactive HTML and PyMOL export."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "Functional Genomics Center Zurich" },
]

dependencies = [
    "cbor2>=5.6,<6",
    "cyclopts",
    "fastexcel",
    "h5py>=3.12",
    "loguru",
    "numpy",
    "polars",
    "requests",
]

[project.scripts]
proptm3d = "proptm3d.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "deptry>=0.23",
    "import-linter>=2,<3",
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.14",
    "twine>=6",
    "xlsxwriter>=3",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "F",   # pyflakes
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "RUF", # ruff-specific
    "C90", # mccabe complexity
    "SIM", # flake8-simplify
    "RET", # flake8-return
    "PTH", # flake8-use-pathlib
    "PT",  # flake8-pytest-style
    "TID", # flake8-tidy-imports
    "ARG", # flake8-unused-arguments
    "EM",  # flake8-errmsg
    "D",   # pydocstyle
    "ANN", # flake8-annotations
]
ignore = ["ANN401"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "ANN", "ARG", "EM"]
# The embedded HTML/JS template has long lines.
"src/proptm3d/web_visualizer.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
branch = true
relative_files = true
source = ["proptm3d"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.deptry]
known_first_party = ["proptm3d"]

[tool.deptry.per_rule_ignores]
# fastexcel is polars' Excel engine, loaded at runtime rather than imported.
DEP002 = ["fastexcel"]

[tool.importlinter]
root_package = "proptm3d"

[[tool.importlinter.contracts]]
name = "cli composes the pipeline; the pipeline composes independent leaf modules"
type = "layers"
layers = [
    "proptm3d.cli",
    "proptm3d.pipeline",
    "proptm3d.web_visualizer",
    "proptm3d.protein_data | proptm3d.webapp",
    "proptm3d.data_loader | proptm3d.enrichment_loader | proptm3d.payload_io | proptm3d.pymol_exporter | proptm3d.structural_context | proptm3d.structure_fetcher",
    "proptm3d.mudata_reader",
]
