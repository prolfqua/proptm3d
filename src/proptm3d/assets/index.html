<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>proptm3d</title>
    <script src="https://cdn.jsdelivr.net/npm/3dmol@2.5.5/build/3Dmol-min.js"></script>
    <!--
      Tabulator ships its stylesheet separately rather than inlining it, so this
      link is load-bearing: without it the table renders as unstyled divs. Pinned
      to the same version as vendor/tabulator.js.
    -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/tabulator-tables@6.5.2/dist/css/tabulator_midnight.min.css"
    />
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --pane-title-bg: #16202f;
            --viewer-bg: #0b0f19;
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow: hidden;
        }
        ptm-app { display: flex; flex-direction: column; height: 100vh; }
        [hidden] { display: none !important; }
        .hidden { display: none !important; }

        .toolbar {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            flex-wrap: wrap;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 0.45rem 1rem;
        }
        .toolbar h1 { font-size: 1rem; font-weight: 700; letter-spacing: 0.02em; margin-right: 0.4rem; }
        .toolbar label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; }
        .toolbar select {
            padding: 0.3rem 0.45rem;
            background-color: var(--bg-color);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 5px;
            font-size: 0.82rem;
        }
        .toolbar a { color: var(--accent); font-size: 0.82rem; text-decoration: none; }
        .toolbar .status { margin-left: auto; font-size: 0.8rem; color: var(--text-muted); white-space: nowrap; }

        .tabs { display: flex; gap: 2px; margin-right: 0.6rem; }
        .tab {
            font: inherit;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-muted);
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0.3rem 0.8rem;
            cursor: pointer;
            max-width: 26rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .tab:hover:not(:disabled) { color: var(--text-main); }
        .tab.active { color: var(--bg-color); background: var(--accent); border-color: var(--accent); }
        .tab:disabled { opacity: 0.45; cursor: default; }

        .workspace { flex: 1; min-height: 0; display: flex; }
        .main-row { display: flex; flex: 1; min-height: 0; min-width: 0; }
        .left-col {
            flex: none;
            min-height: 0;
            display: flex;
            flex-direction: column;
            background-color: var(--card-bg);
        }
        .right-col { flex: 1; min-width: 0; display: flex; flex-direction: column; }
        .pane { flex: 1; min-height: 0; display: flex; flex-direction: column; }
        .pane-title {
            flex: none;
            display: flex;
            align-items: baseline;
            gap: 0.8rem;
            padding: 3px 8px;
            font-size: 0.68rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
            background-color: var(--pane-title-bg);
            border-bottom: 1px solid var(--border-color);
        }
        .pane-title .count { color: var(--text-main); text-transform: none; letter-spacing: 0; }
        .pane-title .hint { margin-left: auto; font-weight: 400; text-transform: none; letter-spacing: 0; }
        .pane-body { flex: 1; min-height: 0; }
        .splitter {
            flex: none;
            width: 6px;
            cursor: col-resize;
            background-color: var(--border-color);
            opacity: 0.6;
        }
        .splitter:hover, .splitter.dragging { background-color: var(--accent); opacity: 1; }

        .viewer-host { position: relative; flex: 1; min-width: 0; min-height: 200px; background-color: var(--viewer-bg); }
        #viewers { display: flex; height: 100%; }
        .viewer-panel { flex: 1; min-width: 0; position: relative; }
        .viewer-panel + .viewer-panel { border-left: 1px solid var(--border-color); }
        .panel-label {
            position: absolute;
            top: 8px;
            left: 12px;
            z-index: 5;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--accent);
            background: rgba(15, 23, 42, 0.8);
            padding: 2px 8px;
            border-radius: 4px;
        }
        .mol-host { width: 100%; height: 100%; }

        .legend {
            position: absolute;
            right: 10px;
            bottom: 10px;
            z-index: 5;
            pointer-events: none;
            font-size: 0.66rem;
            color: var(--text-muted);
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 6px 8px;
            display: grid;
            gap: 2px;
        }
        .legend-title { font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; margin-top: 2px; }
        .legend-row { display: flex; align-items: center; gap: 6px; }
        .legend-row i { width: 9px; height: 9px; border-radius: 50%; flex: none; }
        .legend-scale { display: flex; align-items: center; gap: 5px; }
        .legend-scale i { width: 54px; height: 8px; border-radius: 2px; background: linear-gradient(90deg, #33ff33, #ffffff, #ff3333); }

        .ntoc-pane {
            flex: none;
            display: flex;
            flex-direction: column;
            border-top: 1px solid var(--border-color);
            background-color: var(--viewer-bg);
        }
        #ntoc { flex: 1; min-height: 0; }

        #proteinTable, #ptmTable, #categoriesTable { height: 100%; }
        .tabulator { font-size: 0.74rem; }
        .tabulator .tabulator-cell, .tabulator .tabulator-col { padding: 3px 5px; }
        .tabulator-row.tabulator-selected { background-color: #0369a1; }
        .tabulator-row { cursor: pointer; }
    </style>
</head>
<body>
    <ptm-app></ptm-app>
    <noscript>This viewer is a JavaScript application and needs scripting enabled.</noscript>
    <script type="module" src="app.js"></script>
</body>
</html>
